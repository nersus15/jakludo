services:
  jakludo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jakludo-app
    restart: unless-stopped
    ports:
      - "${PORT:-5172}:5172"
    environment:
      - NODE_ENV=production
      - PORT=5172
      # Isi 1 jika diakses lewat Nginx reverse proxy agar rate limit login memakai IP asli pemain
      - TRUST_PROXY=${TRUST_PROXY:-0}
    volumes:
      # Mount direktori data lokal ke container agar database users & leaderboard persisten
      - ./server/data:/app/server/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5172/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

