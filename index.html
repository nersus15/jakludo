<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>JakLudo · Main Ludo online bareng teman</title>

    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="description" content="Main Ludo online bareng teman, sampai empat pemain secara realtime. Buat room, bagikan kodenya, dan rebut gelar Ludo King." />
    <meta name="theme-color" content="#f5ecdc" />
    <!-- Pasang tema tersimpan sebelum halaman digambar agar tidak berkedip (default: terang) -->
    <script>
      (function () {
        var pref = 'light';
        try { pref = localStorage.getItem('jakludo_theme') || 'light'; } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1a1512');
      })();
    </script>

    <!-- Font: Fredoka (judul & angka, bulat seperti huruf logo) & Nunito (isi), lihat DESIGN.md -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS Safari PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JakLudo" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/jpeg" href="/jakludo-logo.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/client/src/main.jsx"></script>
    <script>
      // Registrasi Service Worker PWA (nonaktifkan di port dev Vite agar tidak meng-cache modul dev)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          var isViteDev = location.port === '5173' || location.port === '5174';
          if (isViteDev) {
            navigator.serviceWorker.getRegistrations().then(regs => {
              regs.forEach(r => r.unregister());
            });
            return;
          }
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('JakLudo PWA ServiceWorker active:', reg.scope))
            .catch(err => console.log('JakLudo ServiceWorker registration error:', err));
        });
      }
    </script>
  </body>
</html>
